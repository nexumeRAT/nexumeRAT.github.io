<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bunny trap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #242424;
      font-family: sans-serif;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: min(90vw, 700px);
      aspect-ratio: 4 / 3;
      user-select: none;
    }

    .rat-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 220ms ease;
      pointer-events: none;
    }

    #ratIdle {
      opacity: 1;
    }

    #ratReveal {
      opacity: 0;
    }

    .scene.petted #ratIdle {
      opacity: 0;
    }

    .scene.petted #ratReveal {
      opacity: 1;
    }

    .pet-zone {
      position: absolute;
      left: 39%;
      top: 10%;
      width: 22%;
      height: 25%;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 5;
    }

    .pet-zone:hover {
      cursor: pointer;
    }

    .surprise {
      position: absolute;
      left: 53%;
      top: 52%;
      width: 75%;

      transform: translate(-50%, -50%) rotate(-12deg) scale(0.8);
      transform-origin: center;

      opacity: 0;
      z-index: 4;
      pointer-events: none;

      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.25));
      border-radius: 12px;

      transition:
        opacity 1000ms ease,
        transform 800ms ease;

      transition-delay: 0ms;
    }

    .scene.petted .surprise {
      opacity: 1;
      transform: translate(-50%, -50%) rotate(-12deg) scale(1);
    }

    .pet-text {
      position: absolute;
      left: 50%;
      bottom: -10rem;
      transform: translateX(-50%);
  font-family: "Fredoka", sans-serif;
  font-size: clamp(1.5rem, 5vw, 3rem);
  font-weight: 450;
      color: #999999;
      text-align: center;
      width: 100%;
white-space: pre-line;
    }

    .scene.petted .pet-text {
      color: #ff7777;
    }

    .reset-btn {
      position: fixed;
      bottom: 18px;
      right: 18px;
      border: none;
      border-radius: 999px;
      padding: 0.75rem 1rem;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 0.95rem;
    }

@media (max-width: 600px) {
  body {
    min-height: 100dvh;
    overflow-x: hidden;
    overflow-y: auto;
  }

  .scene {
    width: 95vw;
    margin-bottom: 6rem;
  }

  .pet-text {
    bottom: -6rem;
    width: 100%;
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    line-height: 1.2;
    white-space: pre-line;
  }

  .reset-btn {
    bottom: 12px;
    right: 12px;
  }
}
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <img id="ratIdle" class="rat-layer" src="rat-idle.png" alt="rat" />
    <img id="ratReveal" class="rat-layer" src="rat-reveal.png" alt="rat revealing hand" />

    <img class="surprise" src="surprise.png" alt="surprise image" />

    <button class="pet-zone" id="petZone" aria-label="Pet the rat"></button>

    <div class="pet-text" id="petText">Pet the rat for free carrots
🥕🥕🥕</div>
  </div>

  <button class="reset-btn" id="resetBtn">reset</button>

    <script>
      const scene = document.getElementById("scene");
      const petZone = document.getElementById("petZone");
      const resetBtn = document.getElementById("resetBtn");
      const petText = document.getElementById("petText");

      const amongUs = new Audio("among-us.mp3");
      amongUs.volume = 0.6;

        petZone.addEventListener("click", () => {
          if (scene.classList.contains("petted")) return;

          scene.classList.add("petted");
          petText.textContent = "⚠ You've been RATTED ⚠";

          amongUs.currentTime = 0;
          amongUs.play().catch(console.error);
        });

      resetBtn.addEventListener("click", () => {
        scene.classList.remove("petted");
        petText.textContent = "Pet the rat for free carrots\n🥕🥕🥕";

        amongUs.pause();
        amongUs.currentTime = 0;
      });
    </script>
</body>
</html>
